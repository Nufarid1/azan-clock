<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Azan Clock BLE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 16px; max-width: 480px; margin: auto; }
        h1 { text-align: center; }
        .status { background: #1e293b; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 16px; font-weight: 600; }
        button { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: #10b981; color: white; }
        .btn-secondary { background: #f59e0b; color: white; }
        .btn-gray { background: #64748b; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-connect { background: #3b82f6; color: white; }
        .row { display: flex; gap: 8px; }
        .row button { flex: 1; }
        input { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; background: #1e293b; color: white; }
        .section { background: #1e293b; padding: 14px; border-radius: 12px; margin: 14px 0; }
        label { display: block; margin: 6px 0; }
        .log { background: #000; color: #0f0; padding: 8px; border-radius: 8px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>

<h1>Azan Clock (BLE)</h1>

<div class="status" id="connStatus">❌ Не подключено</div>

<!-- Блок подключения -->
<button class="btn-connect" id="btnAutoConnect" onclick="autoConnect()" style="display:none;">⚡ Быстрое подключение</button>
<button class="btn-primary" id="btnConnect" onclick="connectBLE()">🔗 Подключиться (выбрать устройство)</button>
<button class="btn-gray" id="btnDisconnect" onclick="disconnectBLE()" disabled>Отключиться</button>

<div class="section">
    <h3>Управление MP3</h3>
    <button class="btn-primary cmd-btn" onclick="sendCmd('AZAN')" disabled>▶ Запустить Азан</button>
    <div class="row">
        <button class="btn-secondary cmd-btn" onclick="sendCmd('PAUSE')" disabled>⏸ Пауза</button>
        <button class="btn-secondary cmd-btn" onclick="sendCmd('RESUME')" disabled>⏵ Продолжить</button>
    </div>
    <button class="btn-danger cmd-btn" onclick="sendCmd('STOP')" disabled>⏹ СТОП</button>
</div>

<div class="section">
    <h3>Управление реле</h3>
    <div class="row">
        <button class="btn-secondary cmd-btn" onclick="sendCmd('LEDON')" disabled>💡 ВКЛ</button>
        <button class="btn-gray cmd-btn" onclick="sendCmd('LEDOFF')" disabled>🌑 ВЫКЛ</button>
    </div>
</div>

<div class="section">
    <h3>Громкость</h3>
    <label>Текущая: <span id="volVal">20</span></label>
    <input type="range" id="volRange" min="0" max="30" value="20" oninput="document.getElementById('volVal').innerText=this.value">
    <button class="btn-primary cmd-btn" onclick="sendCmd('VOL:' + document.getElementById('volRange').value)" disabled>Установить громкость</button>
</div>

<div class="section">
    <h3>Лог</h3>
    <div class="log" id="logBox"></div>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    const DEVICE_NAME = "AzanClock-BLE";

    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    // Элементы UI
    const statusEl = document.getElementById('connStatus');
    const btnConnect = document.getElementById('btnConnect');
    const btnAutoConnect = document.getElementById('btnAutoConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const cmdBtns = document.querySelectorAll('.cmd-btn');

    // Функция лога
    function log(msg) {
        const logBox = document.getElementById('logBox');
        logBox.innerHTML += msg + '<br>';
        logBox.scrollTop = logBox.scrollHeight;
        console.log(msg);
    }

    // Обновление интерфейса при подключении/отключении
    function updateUI(connected, deviceName = '') {
        if (connected) {
            statusEl.innerText = "✅ Подключено к " + (deviceName || "устройству");
            statusEl.style.color = "#10b981";
            btnConnect.style.display = "none";
            btnAutoConnect.style.display = "none";
            btnDisconnect.disabled = false;
            cmdBtns.forEach(b => b.disabled = false);
        } else {
            statusEl.innerText = "❌ Не подключено";
            statusEl.style.color = "red";
            btnConnect.style.display = "block";
            btnDisconnect.disabled = true;
            cmdBtns.forEach(b => b.disabled = true);
        }
    }

    // 1. ОБЫЧНОЕ ПОДКЛЮЧЕНИЕ (с выбором устройства)
    async function connectBLE() {
        try {
            log("Запрос устройства...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: DEVICE_NAME }],
                optionalServices: [SERVICE_UUID]
            });

            log("Устройство выбрано: " + bluetoothDevice.name);
            statusEl.innerText = "⏳ Подключение...";
            statusEl.style.color = "orange";

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
            await doGattConnect(bluetoothDevice);
            
        } catch (error) {
            log("Ошибка: " + error);
            statusEl.innerText = "❌ Ошибка подключения";
            statusEl.style.color = "red";
        }
    }

    // 2. АВТОМАТИЧЕСКОЕ ПОДКЛЮЧЕНИЕ (без выбора, если разрешение уже было)
    async function autoConnect() {
        try {
            log("Поиск ранее подключенных устройств...");
            const devices = await navigator.bluetooth.getDevices();
            
            if (devices.length === 0) {
                log("Нет сохраненных устройств. Используйте обычное подключение.");
                return;
            }

            // Ищем наши часы по имени или берем первое попавшееся
            const device = devices.find(d => d.name === DEVICE_NAME) || devices[0];
            log("Найдено устройство: " + device.name);

            statusEl.innerText = "⏳ Автоподключение...";
            statusEl.style.color = "orange";

            bluetoothDevice = device;
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
            await doGattConnect(bluetoothDevice);

        } catch (error) {
            log("Ошибка автоподключения: " + error);
            statusEl.innerText = "❌ Ошибка автоподключения";
            statusEl.style.color = "red";
        }
    }

    // Вспомогательная функция для GATT
    async function doGattConnect(device) {
        const server = await device.gatt.connect();
        log("GATT подключен");

        const service = await server.getPrimaryService(SERVICE_UUID);
        log("Сервис найден");

        bluetoothCharacteristic = await service.getCharacteristic(CHAR_UUID);
        log("Характеристика найдена");

        await bluetoothCharacteristic.startNotifications();
        bluetoothCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
        log("Уведомления включены");

        updateUI(true, device.name);
    }

    function onDisconnected() {
        log("Устройство отключено");
        bluetoothCharacteristic = null;
        updateUI(false);
        checkSavedDevices(); // Проверяем, можно ли предложить автоподключение
    }

    async function disconnectBLE() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
            log("Отключение...");
        }
    }

    function handleNotifications(event) {
        const value = event.target.value;
        const decoder = new TextDecoder('utf-8');
        const text = decoder.decode(value);
        log("📥 Ответ от часов: " + text);
    }

    async function sendCmd(cmd) {
        if (!bluetoothCharacteristic) {
            log("Ошибка: сначала подключитесь!");
            return;
        }
        try {
            const encoder = new TextEncoder();
            const data = encoder.encode(cmd);
            await bluetoothCharacteristic.writeValue(data);
            log("📤 Отправлено: " + cmd);
        } catch (error) {
            log("Ошибка отправки: " + error);
        }
    }

    // Проверка наличия сохраненных устройств для показа кнопки автоподключения
    async function checkSavedDevices() {
        if (navigator.bluetooth && navigator.bluetooth.getDevices) {
            try {
                const devices = await navigator.bluetooth.getDevices();
                if (devices.length > 0) {
                    btnAutoConnect.style.display = "block"; // Показываем кнопку быстрого подключения
                }
            } catch (e) {
                console.log("Не удалось получить список устройств", e);
            }
        }
    }

    // Инициализация при загрузке страницы
    window.onload = () => {
        updateUI(false);
        checkSavedDevices();
    };
</script>

<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
