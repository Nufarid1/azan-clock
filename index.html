<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Azan Clock BLE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body { font-family: system-ui; background: #0f172a; color: #e2e8f0; padding: 16px; max-width: 480px; margin: auto; }
        h1 { text-align: center; }
        .status { background: #1e293b; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 16px; font-weight: 600; transition: background .2s, color .2s; }
        button { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        button:active:not(:disabled) { opacity: 0.8; }
        .btn-primary { background: #10b981; color: white; }
        .btn-secondary { background: #f59e0b; color: white; }
        .btn-gray { background: #64748b; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-connect { background: #3b82f6; color: white; }
        .row { display: flex; gap: 8px; }
        .row button { flex: 1; }
        input, select { width: 100%; padding: 12px; margin: 6px 0; border-radius: 10px; border: none; background: #1e293b; color: white; font-size: 1rem; }
        .section { background: #1e293b; padding: 14px; border-radius: 12px; margin: 14px 0; }
        label { display: block; margin: 6px 0; font-size: 0.9rem; opacity: 0.8; }
        .log { background: #000; color: #0f0; padding: 8px; border-radius: 8px; font-family: monospace; height: 120px; overflow-y: auto; font-size: 0.8rem; margin-top: 10px; }
        .btn-track { font-size: 1.2rem; padding: 10px; display: flex; justify-content: center; align-items: center; }
        .prayer-list { background: #0f172a; border-radius: 10px; padding: 10px; margin-top: 10px; font-family: monospace; }
        .prayer-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1e293b; }
        .prayer-item:last-child { border-bottom: none; }
    </style>
</head>
<body>

<h1>Azan Clock (BLE)</h1>

<div class="status" id="connStatus">❌ Не подключено</div>

<!-- Блок подключения -->
<button class="btn-connect" id="btnAutoConnect" onclick="autoConnect()" style="display:none;">⚡ Быстрое подключение</button>
<button class="btn-primary" id="btnConnect" onclick="connectBLE()">🔗 Подключиться (выбрать устройство)</button>
<button class="btn-gray" id="btnDisconnect" onclick="disconnectBLE()" disabled>Отключиться</button>

<!-- ВРЕМЕНА НАМАЗА -->
<div class="section">
    <h3>🕌 Времена намаза на сегодня</h3>
    <div class="prayer-list" id="prayerList">
        <div class="prayer-item"><span>Фаджр</span><span id="p-fajr">--:--</span></div>
        <div class="prayer-item"><span>Зухр</span><span id="p-dhuhr">--:--</span></div>
        <div class="prayer-item"><span>Аср</span><span id="p-asr">--:--</span></div>
        <div class="prayer-item"><span>Магриб</span><span id="p-maghrib">--:--</span></div>
        <div class="prayer-item"><span>Иша</span><span id="p-isha">--:--</span></div>
    </div>
    <button class="btn-primary cmd-btn" onclick="sendCmd('GETPRAYERS')" disabled>🔄 Обновить с часов</button>
</div>

<!-- УПРАВЛЕНИЕ MP3 -->
<div class="section">
    <h3>🎵 Управление MP3</h3>
    
    <button class="btn-primary cmd-btn" onclick="sendCmd('AZAN')" disabled>▶ Запустить Азан</button>
    
    <div class="row" style="margin: 10px 0;">
        <button class="btn-secondary btn-track cmd-btn" onclick="sendCmd('PREV')" disabled>⏮ Пред.</button>
        <button class="btn-secondary btn-track cmd-btn" onclick="sendCmd('NEXT')" disabled>След. ⏭</button>
    </div>
    
    <div class="row">
        <button class="btn-secondary cmd-btn" onclick="sendCmd('PAUSE')" disabled>⏸ Пауза</button>
        <button class="btn-secondary cmd-btn" onclick="sendCmd('RESUME')" disabled>⏵ Продолжить</button>
    </div>
    <button class="btn-danger cmd-btn" onclick="sendCmd('STOP')" disabled>⏹ СТОП</button>
    
    <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
        <label>Включить конкретный трек:</label>
        <input type="number" id="trackInput" min="1" max="20" value="1" placeholder="Номер трека">
        <button class="btn-primary cmd-btn" onclick="playTrack()" disabled>Включить трек</button>
    </div>

    <div style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 10px;">
        <label>Громкость: <span id="volVal">20</span></label>
        <input type="range" id="volRange" min="0" max="30" value="20" oninput="document.getElementById('volVal').innerText=this.value">
        <button class="btn-primary cmd-btn" onclick="sendCmd('VOL:' + document.getElementById('volRange').value)" disabled>Установить громкость</button>
    </div>
</div>

<!-- РЕЛЕ -->
<div class="section">
    <h3>💡 Реле</h3>
    <div class="row">
        <button class="btn-secondary cmd-btn" onclick="sendCmd('LEDON')" disabled>ВКЛ</button>
        <button class="btn-gray cmd-btn" onclick="sendCmd('LEDOFF')" disabled>ВЫКЛ</button>
    </div>
</div>

<!-- WIFI -->
<div class="section">
    <h3>📶 WiFi</h3>
    <button class="btn-secondary cmd-btn" onclick="scanWifi()" disabled>🔍 Найти сети</button>
    
    <div id="wifiList" style="display:none; margin-top: 10px;">
        <label>Выберите сеть:</label>
        <select id="wifiSSID">
            <option value="">-- Выберите --</option>
        </select>
        
        <label style="margin-top:10px;">Пароль:</label>
        <input type="password" id="wifiPass" placeholder="Пароль от WiFi">
        
        <button class="btn-primary cmd-btn" onclick="connectWifi()" disabled>🔗 Подключиться</button>
    </div>
</div>

<!-- БУДИЛЬНИК -->
<div class="section">
    <h3>⏰ Будильник</h3>
    <div class="row">
        <input type="number" id="ah" min="0" max="23" value="7" placeholder="Час">
        <input type="number" id="am" min="0" max="59" value="0" placeholder="Мин">
    </div>
    <input type="number" id="atrack" min="1" max="20" value="1" placeholder="Трек для будильника">
    <label><input type="checkbox" id="aen"> Включить будильник</label>
    <button class="btn-primary cmd-btn" onclick="saveAlarm()" disabled>Сохранить будильник</button>
</div>

<!-- КООРДИНАТЫ -->
<div class="section">
    <h3>📍 Координаты и метод</h3>
    <label>Широта (Latitude)</label>
    <input type="number" step="any" id="lat" value="55.7558">
    <label>Долгота (Longitude)</label>
    <input type="number" step="any" id="lon" value="37.6173">
    <label>Метод расчета (14 = Россия)</label>
    <input type="number" id="method" value="14">
    <button class="btn-primary cmd-btn" onclick="saveLoc()" disabled>Сохранить координаты</button>
</div>

<!-- ТИХИЕ ЧАСЫ -->
<div class="section">
    <h3>🌙 Тихие часы</h3>
    <div class="row">
        <input type="number" id="qs" min="0" max="23" value="22" placeholder="Начало (час)">
        <input type="number" id="qe" min="0" max="23" value="6" placeholder="Конец (час)">
    </div>
    <label><input type="checkbox" id="qen"> Включить тихие часы</label>
    <button class="btn-primary cmd-btn" onclick="saveQuiet()" disabled>Сохранить тихие часы</button>
</div>

<div class="section">
    <h3>Лог</h3>
    <div class="log" id="logBox"></div>
</div>

<script>
    const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
    const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
    const DEVICE_NAME = "AzanClock-BLE";

    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    const statusEl = document.getElementById('connStatus');
    const btnConnect = document.getElementById('btnConnect');
    const btnAutoConnect = document.getElementById('btnAutoConnect');
    const btnDisconnect = document.getElementById('btnDisconnect');
    const cmdBtns = document.querySelectorAll('.cmd-btn');

    function log(msg) {
        const logBox = document.getElementById('logBox');
        logBox.innerHTML += msg + '<br>';
        logBox.scrollTop = logBox.scrollHeight;
        console.log(msg);
    }

    function updateUI(connected, deviceName = '') {
        if (connected) {
            statusEl.innerText = "✅ Подключено к " + (deviceName || "устройству");
            statusEl.style.color = "#10b981";
            btnConnect.style.display = "none";
            btnAutoConnect.style.display = "none";
            btnDisconnect.disabled = false;
            cmdBtns.forEach(b => b.disabled = false);
        } else {
            statusEl.innerText = "❌ Не подключено";
            statusEl.style.color = "#ef4444";
            btnConnect.style.display = "block";
            btnDisconnect.disabled = true;
            cmdBtns.forEach(b => b.disabled = true);
        }
    }

    async function connectBLE() {
        try {
            log("Запрос устройства...");
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                filters: [{ name: DEVICE_NAME }],
                optionalServices: [SERVICE_UUID]
            });

            log("Устройство выбрано: " + bluetoothDevice.name);
            statusEl.innerText = "⏳ Подключение...";
            statusEl.style.color = "orange";

            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
            await doGattConnect(bluetoothDevice);
            
        } catch (error) {
            log("Ошибка: " + error);
            statusEl.innerText = "❌ Ошибка подключения";
            statusEl.style.color = "red";
        }
    }

    async function autoConnect() {
        try {
            log("Поиск ранее подключенных устройств...");
            const devices = await navigator.bluetooth.getDevices();
            
            if (devices.length === 0) {
                log("Нет сохраненных устройств. Используйте обычное подключение.");
                return;
            }

            const device = devices.find(d => d.name === DEVICE_NAME) || devices[0];
            log("Найдено устройство: " + device.name);

            statusEl.innerText = "⏳ Автоподключение...";
            statusEl.style.color = "orange";

            bluetoothDevice = device;
            bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);
            await doGattConnect(bluetoothDevice);

        } catch (error) {
            log("Ошибка автоподключения: " + error);
            statusEl.innerText = "❌ Ошибка автоподключения";
            statusEl.style.color = "red";
        }
    }

    async function doGattConnect(device) {
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        bluetoothCharacteristic = await service.getCharacteristic(CHAR_UUID);
        
        await bluetoothCharacteristic.startNotifications();
        bluetoothCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);
        
        log("Успешно подключено!");
        updateUI(true, device.name);
        
        // Автоматически запрашиваем времена намаза после подключения
        setTimeout(() => {
            sendCmd('GETPRAYERS');
            checkPrayerSync();
        }, 1000);
    }

    function onDisconnected() {
        log("Устройство отключено");
        bluetoothCharacteristic = null;
        updateUI(false);
        checkSavedDevices();
    }

    function disconnectBLE() {
        if (bluetoothDevice && bluetoothDevice.gatt.connected) {
            bluetoothDevice.gatt.disconnect();
        }
    }

    function handleNotifications(event) {
        const text = new TextDecoder('utf-8').decode(event.target.value);
        log("📥 Ответ: " + text);
        
        // Обработка списка сетей
        if (text.startsWith("NETWORKS:")) {
            const list = text.substring(9);
            const select = document.getElementById('wifiSSID');
            select.innerHTML = '<option value="">-- Выберите --</option>';
            
            if (list.length > 0) {
                const networks = list.split(';').filter(n => n.length > 0);
                networks.forEach(net => {
                    const [ssid, rssi] = net.split(',');
                    const opt = document.createElement('option');
                    opt.value = ssid;
                    opt.textContent = ssid + ' (' + rssi + ' dBm)';
                    select.appendChild(opt);
                });
            } else {
                log("Сети не найдены");
            }
            document.getElementById('wifiList').style.display = 'block';
        }
        
        // Обработка результата подключения WiFi
        if (text.startsWith("WIFI OK:")) {
            log("✅ WiFi подключен! IP: " + text.substring(8));
        } else if (text === "WIFI FAIL") {
            log("❌ Не удалось подключиться к WiFi. Проверьте пароль.");
        }
        
        // Обработка времени намаза
        if (text.startsWith("PRAYERS:")) {
            const times = text.substring(8).split(';');
            if (times.length === 5) {
                document.getElementById('p-fajr').innerText = times[0];
                document.getElementById('p-dhuhr').innerText = times[1];
                document.getElementById('p-asr').innerText = times[2];
                document.getElementById('p-maghrib').innerText = times[3];
                document.getElementById('p-isha').innerText = times[4];
                log("✅ Времена намаза обновлены");
            }
        }
        
        // Обработка дня намаза
        if (text.startsWith("PRAYERDAY:")) {
            const savedDay = parseInt(text.substring(10));
            const today = new Date().getDate();
            if (savedDay !== today) {
                log("⚠️ Расписание устарело. Загружаю на неделю...");
                downloadWeekPrayer();
            } else {
                log("✅ Расписание на сегодня актуально.");
            }
        }
    }

    async function sendCmd(cmd) {
        if (!bluetoothCharacteristic) {
            log("Ошибка: сначала подключитесь!");
            return;
        }
        try {
            const data = new TextEncoder().encode(cmd);
            await bluetoothCharacteristic.writeValue(data);
            log("📤 Отправлено: " + cmd);
        } catch (error) {
            log("Ошибка отправки: " + error);
            if (!bluetoothDevice?.gatt?.connected) updateUI(false);
        }
    }

    function playTrack() {
        const trackNum = document.getElementById('trackInput').value;
        if (!trackNum || trackNum < 1 || trackNum > 20) {
            log("Ошибка: номер трека от 1 до 20");
            return;
        }
        sendCmd('TRACK:' + trackNum);
    }

    function saveAlarm() {
        const h = document.getElementById('ah').value;
        const m = document.getElementById('am').value;
        const en = document.getElementById('aen').checked ? 1 : 0;
        const track = document.getElementById('atrack').value;
        sendCmd('ALARM:' + h + ';' + m + ';' + en + ';' + track);
    }

    function saveLoc() {
        const lat = document.getElementById('lat').value;
        const lon = document.getElementById('lon').value;
        const method = document.getElementById('method').value;
        sendCmd('LOC:' + lat + ';' + lon);
        sendCmd('METHOD:' + method);
    }

    function saveQuiet() {
        const qs = document.getElementById('qs').value;
        const qe = document.getElementById('qe').value;
        const en = document.getElementById('qen').checked ? 1 : 0;
        sendCmd('QUIET:' + qs + ';' + qe + ';' + en);
    }

    // === WiFi ===
    function scanWifi() {
        if (!bluetoothCharacteristic) return;
        log("🔍 Запрос сканирования WiFi...");
        sendCmd('SCAN');
        document.getElementById('wifiList').style.display = 'none';
    }

    function connectWifi() {
        const ssid = document.getElementById('wifiSSID').value;
        const pass = document.getElementById('wifiPass').value;
        if (!ssid) { log("Выберите сеть"); return; }
        log("📤 Подключение к " + ssid);
        sendCmd('WIFI:' + ssid + ';' + pass);
    }

    // === Автосинхронизация намаза на неделю ===
    async function checkPrayerSync() {
        await sendCmd('GETPRAYERDAY');
    }

    async function downloadWeekPrayer() {
        const lat = document.getElementById('lat').value || 55.7558;
        const lon = document.getElementById('lon').value || 37.6173;
        const method = document.getElementById('method').value || 14;
        
        const today = new Date();
        let weekData = "";
        
        log("⏳ Загрузка расписания на 7 дней...");
        
        for (let i = 0; i < 7; i++) {
            const d = new Date(today);
            d.setDate(today.getDate() + i);
            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            const dateStr = `${day}-${month}-${year}`;
            
            try {
                const url = `https://api.aladhan.com/v1/timings/${dateStr}?latitude=${lat}&longitude=${lon}&method=${method}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.code === 200) {
                    const t = data.data.timings;
                    weekData += `${d.getDate()};${t.Fajr};${t.Dhuhr};${t.Asr};${t.Maghrib};${t.Isha}`;
                    if (i < 6) weekData += "|";
                    log(`  ${d.getDate()}.${month}: ${t.Fajr}, ${t.Dhuhr}, ${t.Asr}, ${t.Maghrib}, ${t.Isha}`);
                } else {
                    log(`  Ошибка API для ${dateStr}`);
                    return;
                }
            } catch (e) {
                log(`  Ошибка сети для ${dateStr}: ${e.message}`);
                return;
            }
        }
        
        log("📤 Отправка расписания на часы...");
        await sendCmd("WEEK:" + weekData);
        log("✅ Расписание на неделю отправлено!");
    }

    async function checkSavedDevices() {
        if (navigator.bluetooth && navigator.bluetooth.getDevices) {
            try {
                const devices = await navigator.bluetooth.getDevices();
                if (devices.length > 0) {
                    btnAutoConnect.style.display = "block";
                } else {
                    btnAutoConnect.style.display = "none";
                }
            } catch (e) {
                console.log("Не удалось получить список устройств", e);
            }
        }
    }

    window.onload = () => {
        updateUI(false);
        checkSavedDevices();
    };
</script>

<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
</script>

</body>
</html>
